name: Deploy demo to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out docs repository
        uses: actions/checkout@v4

      - name: Check out Giorgio IM
        uses: actions/checkout@v4
        with:
          repository: m-finder/giorgio-im
          path: giorgio-im

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: giorgio-im/package-lock.json

      - name: Install dependencies
        working-directory: giorgio-im
        run: npm ci

      - name: Build demo
        working-directory: giorgio-im
        run: |
          cat > demo-vite.config.ts <<'EOF'
          import { defineConfig } from 'vite'
          import vue from '@vitejs/plugin-vue'

          export default defineConfig({
            plugins: [vue()],
            build: {
              outDir: '../site',
              emptyOutDir: true,
            },
          })
          EOF
          npx vite build --config demo-vite.config.ts

      - name: Publish built demo to main
        run: |
          rm -rf assets
          rm -f index.html .nojekyll
          cp -R site/. .
          touch .nojekyll
          rm -rf giorgio-im site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Demo is already up to date"
          else
            git commit -m "Deploy Giorgio IM demo [skip ci]"
            git push
          fi
